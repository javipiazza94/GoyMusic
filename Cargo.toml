[workspace]
resolver = "2"
members = ["crates/core", "crates/library"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
deunicode = "1"
hound = "3"
lofty = "0.21"
rand = "0.8"
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
tempfile = "3"
thiserror = "2"
walkdir = "2"
