[workspace]
resolver = "2"
members = ["crates/core", "crates/library", "crates/audio", "crates/services", "apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
async-channel = "=2.5.0"
cpal = "=0.15.3"
deunicode = "1"
dirs = "=7.0.0"
flacenc = "=0.5.1"
futures-lite = "=2.6.1"
hound = "3"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
lofty = "0.21"
mpris-server = "=0.10.0"
notify = "=8.2.0"
rand = "0.8"
rayon = "1"
ringbuf = "=0.4.8"
rubato = "=0.16.2"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
strsim = "0.11"
symphonia = { version = "=0.5.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm", "aac", "isomp4", "alac"] }
tauri = "=2.12.1"
tauri-build = "=2.7.1"
tauri-plugin-dialog = "=2.8.1"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tempfile = "3"
thiserror = "2"
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["fmt", "env-filter"] }
walkdir = "2"
